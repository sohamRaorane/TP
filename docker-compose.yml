# Full stack: Postgres + API/collaboration server + client (served by the API in production mode)
#   docker compose up --build    ->  http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sketch
      POSTGRES_PASSWORD: sketch
      POSTGRES_DB: sketchboard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sketch -d sketchboard"]
      interval: 3s
      retries: 20

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 4000
      STORAGE: postgres
      DATABASE_URL: postgresql://sketch:sketch@db:5432/sketchboard
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
